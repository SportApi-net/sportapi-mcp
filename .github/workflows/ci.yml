name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The SportAPI Python client, installed from GitHub until it is available on PyPI.
  SPORTAPI_CLIENT: "sportapi @ git+https://github.com/SportApi-net/sportapi-python@main"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$SPORTAPI_CLIENT" -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Validate server.json against the MCP Registry schema
        run: |
          curl -sSfL "$(python -c 'import json; print(json.load(open("server.json"))["$schema"])')" -o /tmp/server.schema.json
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("/tmp/server.schema.json"))
          jsonschema.validate(json.load(open("server.json")), schema)
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "$SPORTAPI_CLIENT" -e ".[dev]"
      - run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
